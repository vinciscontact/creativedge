name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and prerender
        env:
          # Project pages live under /<repo>/ — both the bundler and the
          # router read this. Change to / (and set the real domain in
          # VITE_SITE_URL) once a custom domain is attached.
          VITE_BASE: /creativedge/
          VITE_SITE_URL: https://vinciscontact.github.io/creativedge
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm run build

      - name: Keep Jekyll off the published files
        run: touch dist/.nojekyll

      # Publishes dist/ to the gh-pages branch — Pages serves that branch
      # ("Deploy from a branch" -> gh-pages / root in repo settings).
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          force_orphan: true
